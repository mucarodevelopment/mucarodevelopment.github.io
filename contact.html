
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Mucaro Development for operations consulting, project management, and technical support.">
  <title>Contact | Mucaro Development</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Contact form styling */
    .contact-form {
      max-width: 600px;
      margin-top: 40px;
    }

    .contact-form form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-form label {
      font-size: 14px;
      margin-top: 10px;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 0;
      background: #fff;
      color: #222;
      font: inherit;
      box-sizing: border-box;
    }

    .contact-form textarea {
      resize: vertical;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: 1px solid #222;
      border-color: #222;
    }

    .contact-form button {
      background: #222;
      color: #fff;
      border: 1px solid #222;
      padding: 14px 24px;
      font: inherit;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s, color 0.2s;
    }

    .contact-form button:hover {
      background: transparent;
      color: #222;
    }

    @media (max-width: 600px) {
      .contact-form {
        margin-top: 30px;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">
      MUCARO DEVELOPMENT
    </a>

    <nav aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="work.html">Work</a>
      <a href="services.html">Services</a>
      <a href="contact.html" class="active"
         aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="page-content">

    <section class="page-intro">
      <h1>Contact</h1>
      <p class="lead">
        Have a project in mind?
        Tell me a little about what you're looking for.
      </p>
    </section>

    <section class="contact-form">

      <form
        action="https://formspree.io/f/mdeeekjy"
        method="POST"
      >

        <label for="name">Your name</label>
        <input
          id="name"
          type="text"
          name="name"
          autocomplete="name"
          required
        >

        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          autocomplete="email"
          required
        >

        <label for="organization">Organization</label>
        <input
          id="organization"
          type="text"
          name="organization"
          autocomplete="organization"
        >

        <label for="message">How can I help?</label>
        <textarea
          id="message"
          name="message"
          rows="5"
          required
        ></textarea>

        <button type="submit">
          Send inquiry
        </button>

      </form>

    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Mucaro Development</p>
    <a href="contact.html">
  Get in touch &rarr;
    </a>
  </footer>

</body>
</html>
